name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["m**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tooling
        run: |
          python3 script/test-release.py
          bash -n script/release

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rustup: [stable]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: script/linux
        run: chmod +x ./script/linux && ./script/linux
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Run DM, signer, and profile regressions
        run: cargo test --locked --verbose -p chat -p state -p person --lib
