name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["m**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tooling
        run: |
          python3 script/test-release.py
          python3 script/test-install-linux.py
          bash -n script/release script/sign-macos-dmg script/install-linux script/flatpak/bundle-flatpak

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rustup: [stable]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: script/linux
        run: chmod +x ./script/linux && ./script/linux
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Run messaging and UI regressions
        run: cargo test --locked --verbose -p chat -p state -p person -p chat_ui -p workspace --lib

      - name: Run dock layout and context-menu regressions
        run: |
          cargo test --locked -p ui --features test-support --lib dock::viewport_tests
          cargo test --locked -p ui --features test-support --lib menu::context_menu::tests
          cargo test --locked -p chat_ui --features test-support --lib emoji_picker::interaction_tests

      - name: Check Linux credential portal fallback on an isolated bus
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y dbus python3-dbus python3-gi
          test ! -e /.flatpak-info
          sudo touch /.flatpak-info
          trap 'sudo rm -f /.flatpak-info' EXIT
          dbus-run-session -- /usr/bin/python3 script/test-credential-portal.py missing
          dbus-run-session -- /usr/bin/python3 script/test-credential-portal.py denied
