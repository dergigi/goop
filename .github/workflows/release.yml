name: Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft release after building all platforms
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version, tag, and changelog
        id: metadata
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 script/check-release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/existing-release.json" \
            --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$status" in
            200) jq -e '.draft == true' "$RUNNER_TEMP/existing-release.json" > /dev/null || {
              echo "Published releases are immutable; choose a new version."
              exit 1
            } ;;
            404) ;; # No release exists yet.
            *) echo "Could not check existing release (HTTP $status)"; exit 1 ;;
          esac

  build:
    needs: validate
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows and macOS builds using cargo-packager
      - name: Build with cargo-packager (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: desktop
        shell: bash
        run: |
          cargo install cargo-packager --locked
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cargo packager --release --formats app
          else
            cargo packager --release
          fi

      - name: Seal macOS bundles and rebuild disk images
        if: runner.os == 'macOS'
        run: bash script/sign-macos-dmg dist/Goop.app

      - name: Name Windows/macOS installers
        if: runner.os != 'Linux'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for file in Path("dist").iterdir():
              if file.suffix in {".dmg", ".msi", ".exe"}:
                  file.rename(file.with_name(f"goop-{os.environ['RELEASE_PLATFORM']}{file.suffix}"))
          PYTHON

      - name: Upload Windows/macOS artifacts
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/*.dmg
            dist/*.msi
            dist/*.exe
          if-no-files-found: error

      # Linux builds using custom scripts
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder snapd squashfs-tools jq gettext-base

      - name: Install Snapcraft
        if: runner.os == 'Linux'
        run: sudo snap install snapcraft --classic

      - name: Make scripts executable
        if: runner.os == 'Linux'
        run: |
          chmod +x script/get-crate-version
          chmod +x script/linux
          chmod +x script/bundle-snap
          chmod +x script/bundle-linux
          chmod +x script/flatpak/deps
          chmod +x script/flatpak/bundle-flatpak

      - name: Install required dependencies
        if: runner.os == 'Linux'
        run: ./script/linux

      # Only build Flatpak and Snap for x86_64 (most common use case)
      - name: Build Flatpak
        if: runner.os == 'Linux'
        run: |
          ./script/bundle-linux --flatpak
          ./script/flatpak/deps
          ./script/flatpak/bundle-flatpak

      - name: Build Snap
        if: runner.os == 'Linux'
        run: |
          VERSION=$(script/get-crate-version goop)
          ./script/bundle-linux
          ./script/bundle-snap $VERSION

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p linux-artifacts
          # Copy the tarball created by bundle-linux
          find target/release -name "*.tar.gz" -exec cp {} linux-artifacts/ \;
          # Find and copy flatpak files (if they exist)
          find . -name "*.flatpak" -exec cp {} linux-artifacts/ \; || true
          # Find and copy snap files (if they exist)
          find . -name "*.snap" -exec cp {} linux-artifacts/ \; || true
          python3 - <<'PYTHON'
          from pathlib import Path
          for file in Path("linux-artifacts").iterdir():
              suffix = ".tar.gz" if file.name.endswith(".tar.gz") else file.suffix
              file.rename(file.with_name("goop-${{ matrix.platform }}" + suffix))
          PYTHON
          ls -la linux-artifacts/

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: linux-artifacts/**/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract validated release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 script/check-release.py --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md" --github-output "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display artifacts structure
        run: |
          echo "Artifacts structure:"
          find artifacts -type f -exec ls -la {} \;

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: artifacts/**/*
