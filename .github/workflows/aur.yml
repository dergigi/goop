name: AUR package
on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/aur.yml'
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm --needed git patchelf namcap desktop-file-utils alsa-lib libxcb libxkbcommon libxkbcommon-x11 vulkan-icd-loader wayland vulkan-swrast xorg-server-xvfb xorg-xauth xdotool dbus hicolor-icon-theme weston
      - uses: actions/checkout@v4
      - name: Build and install package
        run: |
          useradd -m builder
          cp -r packaging/aur /tmp/goop-aur
          chown -R builder:builder /tmp/goop-aur
          cd /tmp/goop-aur
          runuser -u builder -- makepkg --noconfirm
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
          pacman -U --noconfirm goop-bin-*.pkg.tar.zst
          ldd /usr/lib/goop/goop | tee dependencies.log
          ! grep -q 'not found' dependencies.log
          desktop-file-validate /usr/share/applications/goop.desktop
          namcap PKGBUILD goop-bin-*.pkg.tar.zst | tee namcap.log
          ! grep -q ' E: ' namcap.log
      - name: Launch with software graphics
        run: |
          runuser -u builder -- dbus-run-session -- xvfb-run -a sh -c '
            export XDG_RUNTIME_DIR=$(mktemp -d)
            export LIBGL_ALWAYS_SOFTWARE=1
            goop > /tmp/goop-aur/startup.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            sleep 10
            kill -0 "$app_pid"
            xdotool search --onlyvisible --name Goop
          '
      - name: Launch on nested Wayland
        run: |
          runuser -u builder -- dbus-run-session -- xvfb-run -a sh -c '
            export XDG_RUNTIME_DIR=$(mktemp -d)
            export LIBGL_ALWAYS_SOFTWARE=1
            export WAYLAND_DISPLAY=goop-test
            weston --backend=x11 --renderer=pixman --socket=goop-test --idle-time=0 > /tmp/goop-aur/weston.log 2>&1 &
            compositor_pid=$!
            trap "kill $compositor_pid 2>/dev/null || true" EXIT
            for n in $(seq 1 30); do test -S "$XDG_RUNTIME_DIR/goop-test" && break; sleep 1; done
            test -S "$XDG_RUNTIME_DIR/goop-test"
            env -u DISPLAY goop > /tmp/goop-aur/wayland-startup.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid $compositor_pid 2>/dev/null || true" EXIT
            sleep 10
            kill -0 "$app_pid"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aur-package
          include-hidden-files: true
          path: |
            /tmp/goop-aur/.SRCINFO
            /tmp/goop-aur/*.log
            /tmp/goop-aur/*.pkg.tar.zst
